<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1683 1191" role="img" aria-label="RatingSEO Award template">
  <defs>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: Unbounded;
        src: url("fonts/Unbounded.ttf") format("truetype");
        font-weight: 700 800;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/JetBrainsMono-Medium.ttf") format("truetype");
        font-weight: 500;
      }
      @font-face {
        font-family: Onest;
        src: url("fonts/Onest.ttf") format("truetype");
        font-weight: 400 600;
      }
      .bg { fill: #f7f8fa; }
      .frame { fill: none; stroke: #c8ced8; stroke-width: 2; }
      .frame-ink { fill: none; stroke: #10141c; stroke-opacity: 0.18; stroke-width: 1.5; }
      .frame-signal { fill: none; stroke: #e23b12; stroke-opacity: 0.45; stroke-width: 1.5; }
      .brand { font-family: Unbounded, system-ui, sans-serif; font-weight: 800; font-size: 36px; fill: #10141c; }
      .signal { fill: #e23b12; }
      .meta { font-family: "JetBrains Mono", monospace; font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase; fill: #6b7385; }
      .kicker { font-family: "JetBrains Mono", monospace; font-size: 18px; letter-spacing: 0.22em; text-transform: uppercase; fill: #6b7385; }
      .number { font-family: "JetBrains Mono", monospace; font-size: 20px; letter-spacing: 0.14em; fill: #e23b12; }
      .title { font-family: Unbounded, system-ui, sans-serif; font-weight: 800; font-size: 92px; fill: #10141c; }
      .agency { font-family: Unbounded, system-ui, sans-serif; font-weight: 700; font-size: 44px; fill: #10141c; }
      .place { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 96px; fill: #e23b12; }
      .label { font-family: Onest, system-ui, sans-serif; font-size: 28px; fill: #3c4250; }
      .score { font-family: "JetBrains Mono", monospace; font-size: 24px; letter-spacing: 0.08em; fill: #6b7385; }
      .note { font-family: Onest, system-ui, sans-serif; font-size: 20px; fill: #6b7385; }
      .foot { font-family: "JetBrains Mono", monospace; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; fill: #6b7385; }
      .seal-ring { fill: none; stroke: #e23b12; stroke-width: 3; }
      .seal-text { font-family: Unbounded, system-ui, sans-serif; font-weight: 800; font-size: 18px; fill: #e23b12; }
    ]]></style>
