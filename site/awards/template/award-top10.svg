  <text class="number" x="841.5" y="268" text-anchor="middle">No. RS-26Q3-T-0001</text>

  <text class="title" x="841.5" y="370" text-anchor="middle"><tspan class="signal">A</tspan>ward</text>
  <text class="agency" x="841.5" y="460" text-anchor="middle">Seo Performance Agency</text>

  <text class="place" x="841.5" y="590" text-anchor="middle">#01</text>
