  <rect class="frame-ink" x="44" y="44" width="1595" height="1103"/>
  <rect class="frame-signal" x="56" y="56" width="1571" height="1079"/>

  <text class="brand" x="80" y="110">Rating<tspan class="signal">SEO</tspan></text>
