  <text class="number" x="80" y="1105" style="font-size:16px">No. RS-26Q3-T-0001</text>

  <circle class="seal-ring" cx="841.5" cy="1060" r="42"/>
  <text class="seal-text" x="841.5" y="1056" text-anchor="middle">RS</text>
  <text class="foot" x="841.5" y="1078" text-anchor="middle" style="fill:#e23b12;letter-spacing:0.04em">Q3</text>

  <text class="foot" x="1603" y="1040" text-anchor="end">редакция</text>
  <text class="foot" x="1603" y="1070" text-anchor="end">RatingSEO</text>
